    button_4_section:
      name: "🎛️ Button 4 (Off)"
      icon: mdi:power-off
      collapsed: true
      input:
        button_4_entity:
          name: "🔘 Event Entity"
          description: The event entity for this button.
          default: ""
          selector:
            entity:
              domain: event
        button_4_initial_press_action:
