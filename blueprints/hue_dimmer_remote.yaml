blueprint:
  name: Hue Dimmer Remote v2.1
  description: >
    🎛️ **Turn your Hue Dimmer Remote into a fully custom controller.**
    Assign a free action to each button (On, Brighter, Darker, Off) and
    event type (initial_press, repeat, short_release, long_press,
    long_release) — dimming, time-based logic, whatever you need. Each
    button also has an optional **Scene Cycler**: tap through your scenes,
    and the counter resets after a short (fixed) timeout.
    ℹ️ Requires one `input_number` helper per button using the Scene Cycler.
    ℹ️ Home Assistant currently requires each button's event entity to be
    picked explicitly below — triggers can't resolve entities from a
    device selection dynamically (entity_id in a trigger can't be a
    template). Pick the 4 event entities of your remote once when setting
    this up.
    ℹ️ `short_release` is delayed by the Hue Bridge itself (its external
    EventStream API rate-limits updates to ~1/device/second) — this is a
    Bridge firmware limitation, not something this blueprint can speed up
    while staying on the Hue Bridge integration. To avoid that delay, the
    Scene Cycler reacts instantly on `initial_press` instead whenever a
    button has no repeat/long_press/long_release action configured (no
    hold behavior to conflict with). If the button does use repeat/
    long_press/long_release, the cycler falls back to short_release so it
    doesn't fire on the start of a hold.
  domain: automation
  homeassistant:
    min_version: 2024.8.0
  input:
    button_1_section:
      name: "🎛️ Button 1 (On)"
      icon: mdi:power
      collapsed: true
      input:
        button_1_entity:
          name: "🔘 Event Entity"
          description: The event entity for this button.
          default: ""
          selector:
            entity:
              domain: event
        button_1_initial_press_action:
          name: "👆 Action on: initial_press"
          description: Fires immediately on press-down, for both taps and holds.
          default: []
          selector:
            action: {}
        button_1_repeat_action:
          name: "🔁 Action on: repeat (e.g. dimming while held)"
          default: []
          selector:
            action: {}
        button_1_short_release_action:
          name: "✋ Action on: short_release"
          description: >-
            Ignored if a Scene Cycler is configured below and this button
            has no repeat/long_press/long_release action (the cycler then
            reacts on initial_press instead).
          default: []
          selector:
            action: {}
        button_1_long_press_action:
          name: "⏱️ Action on: long_press"
          default: []
          selector:
            action: {}
        button_1_long_release_action:
          name: "🔓 Action on: long_release"
          default: []
          selector:
            action: {}
        button_1_scenes:
          name: "🎬 Scene Cycler: Scene List (optional)"
          description: >-
            If filled in, this overrides the short_release action above.
            If repeat/long_press/long_release are all empty for this
            button, the cycler reacts instantly on initial_press instead
            of waiting for short_release.
          default: []
          selector:
            entity:
              domain: scene
              multiple: true
              reorder: true
        button_1_scene_counter:
          name: "🔢 Scene Cycler: Counter Helper (input_number)"
          description: Required once the scene list is filled in. Min 0 / Max = number of scenes / Step 1.
          default: ""
          selector:
            entity:
              domain: input_number

    button_2_section:
      name: "🎛️ Button 2 (Brighter)"
      icon: mdi:brightness-6
      collapsed: true
      input:
        button_2_entity:
          name: "🔘 Event Entity"
          description: The event entity for this button.
          default: ""
          selector:
            entity:
              domain: event
        button_2_initial_press_action:
