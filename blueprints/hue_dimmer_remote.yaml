  button_1_scene_counter: !input button_1_scene_counter
  button_1_repeat_action: !input button_1_repeat_action
  button_1_long_press_action: !input button_1_long_press_action
  button_1_long_release_action: !input button_1_long_release_action
  button_2_scenes: !input button_2_scenes
  button_2_scene_counter: !input button_2_scene_counter
  button_2_repeat_action: !input button_2_repeat_action
  button_2_long_press_action: !input button_2_long_press_action
  button_2_long_release_action: !input button_2_long_release_action
  button_3_scenes: !input button_3_scenes
  button_3_scene_counter: !input button_3_scene_counter
  button_3_repeat_action: !input button_3_repeat_action
  button_3_long_press_action: !input button_3_long_press_action
