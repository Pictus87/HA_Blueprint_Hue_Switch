    attribute: event_type
    to: long_press
    id: button_4_long_press
  - trigger: state
    entity_id: !input button_4_entity
    attribute: event_type
    to: long_release
    id: button_4_long_release
condition: []
action:
  - choose:
      # Button 1 (On)
      - conditions:
          - condition: trigger
            id: button_1_initial_press
        sequence:
          - choose:
              - conditions: []
                sequence: !input button_1_initial_press_action
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ button_1_scenes | length > 0 and button_1_repeat_action | length == 0 and button_1_long_press_action | length == 0 and button_1_long_release_action | length == 0 }}"
                sequence:
                  - variables:
                      button_1_next_value: >
                        {% set current = states(button_1_scene_counter) | int(0) %}
                        {{ 1 if current >= (button_1_scenes | length) else current + 1 }}
                  - action: input_number.set_value
                    target:
                      entity_id: "{{ button_1_scene_counter }}"
                    data:
                      value: "{{ button_1_next_value }}"
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ button_1_scenes[button_1_next_value - 1] }}"
                  - delay:
                      seconds: 2.5
                  - action: input_number.set_value
                    target:
                      entity_id: "{{ button_1_scene_counter }}"
                    data:
                      value: 0
      - conditions:
          - condition: trigger
            id: button_1_repeat
        sequence: !input button_1_repeat_action
      - conditions:
          - condition: trigger
            id: button_1_short_release
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ button_1_scenes | length > 0 and not (button_1_repeat_action | length == 0 and button_1_long_press_action | length == 0 and button_1_long_release_action | length == 0) }}"
                sequence:
