    entity_id: !input button_1_entity
    attribute: event_type
    to: initial_press
    id: button_1_initial_press
  - trigger: state
    entity_id: !input button_1_entity
    attribute: event_type
    to: repeat
    id: button_1_repeat
  - trigger: state
    entity_id: !input button_1_entity
    attribute: event_type
    to: short_release
    id: button_1_short_release
  - trigger: state
    entity_id: !input button_1_entity
    attribute: event_type
    to: long_press
    id: button_1_long_press
  - trigger: state
    entity_id: !input button_1_entity
    attribute: event_type
    to: long_release
    id: button_1_long_release
  - trigger: state
    entity_id: !input button_2_entity
    attribute: event_type
    to: initial_press
    id: button_2_initial_press
  - trigger: state
    entity_id: !input button_2_entity
    attribute: event_type
    to: repeat
    id: button_2_repeat
  - trigger: state
    entity_id: !input button_2_entity
    attribute: event_type
    to: short_release
