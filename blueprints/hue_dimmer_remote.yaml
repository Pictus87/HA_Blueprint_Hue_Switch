    attribute: event_type
    to: long_release
    id: button_2_long_release
  - trigger: state
    entity_id: !input button_3_entity
    attribute: event_type
    to: initial_press
    id: button_3_initial_press
  - trigger: state
    entity_id: !input button_3_entity
    attribute: event_type
    to: repeat
    id: button_3_repeat
  - trigger: state
    entity_id: !input button_3_entity
    attribute: event_type
    to: short_release
    id: button_3_short_release
  - trigger: state
    entity_id: !input button_3_entity
    attribute: event_type
    to: long_press
    id: button_3_long_press
  - trigger: state
    entity_id: !input button_3_entity
    attribute: event_type
    to: long_release
    id: button_3_long_release
  - trigger: state
    entity_id: !input button_4_entity
    attribute: event_type
